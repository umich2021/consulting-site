<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f1a16;
  --stage-w: 1600px;
  --stage-h: 900px;
  --phone-w: 230px;
  --phone-h: 480px;
  --gap: 44px;
}
* { box-sizing: border-box; margin: 0; }
body { width: var(--stage-w); height: var(--stage-h); overflow: hidden; background: #050807; font-family: 'Manrope', sans-serif; }
.stage { position: relative; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, #12261e 0%, #08100c 55%, #040605 100%); }
.wall { position: absolute; left: 50%; top: 50%; width: 3400px; height: 2600px; margin-left: -1700px; margin-top: -1300px;
  display: flex; justify-content: center; gap: var(--gap); transform-style: preserve-3d; }
.col { display: flex; flex-direction: column; gap: var(--gap); will-change: transform; }
.phone { position: relative; width: var(--phone-w); height: var(--phone-h); border-radius: 38px; background: #0b0d0c; padding: 9px;
  box-shadow: 0 0 0 1.5px #2a332e, 0 30px 60px rgba(0,0,0,0.55); flex-shrink: 0; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 30px; overflow: hidden; }
.notch { position: absolute; top: 10px; left: 50%; width: 70px; height: 20px; margin-left: -35px; border-radius: 12px; background: #050505; z-index: 3; }
.toast { position: absolute; left: 10px; right: 10px; top: 38px; z-index: 4; border-radius: 16px; padding: 10px 12px;
  background: rgba(250,247,240,0.96); color: var(--ink); font-size: 11px; line-height: 1.3; box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
.toast b { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #6e5e3a; margin-bottom: 2px; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(80% 70% at 50% 45%, transparent 40%, rgba(4,6,5,0.85) 100%); }
.glow { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(40% 35% at 30% 20%, rgba(200,164,100,0.18), transparent 70%); }

/* app screens */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 9px; padding: 0 14px 14px; }
.pad { padding-top: 40px; }
.app h4 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.1; }
.app small { font-size: 10px; opacity: 0.7; }
.photo { display: block; width: 100%; object-fit: cover; border-radius: 14px; }
.bleed { margin: 0 -14px; width: calc(100% + 28px); border-radius: 0; height: 190px; }
.over { position: relative; }
.over .caption { position: absolute; left: 14px; right: 14px; bottom: 12px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.5); }
.pill { border-radius: 999px; padding: 9px 10px; font-size: 12px; font-weight: 800; text-align: center; }
.tile { border-radius: 14px; padding: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; }
.slot { border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border-radius: 8px; padding: 6px 8px; font-size: 11px; font-weight: 700; }
.stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.stamp { aspect-ratio: 1; border-radius: 50%; }
.tabbar { margin-top: auto; display: flex; justify-content: space-around; padding-top: 6px; }
.tabbar i { width: 18px; height: 18px; border-radius: 6px; display: block; opacity: 0.45; }
</style>
</head>
<body>
<div class="stage">
  <div class="wall" id="wall"></div>
  <div class="glow"></div>
  <div class="vignette"></div>
</div>
<script>
const LOOP_SECONDS = 20
const COLUMNS = 11
const PHONES_PER_COLUMN = 6
const STEP = 480 + 44

const tabs = (color) => `<div class="tabbar">${`<i style="background:${color}"></i>`.repeat(4)}</div>`

// Twelve made-up businesses of different kinds, each with its own photo, palette and screen layout.
const SCREENS = [
  () => `<div class="app" style="background:#fff8f0;color:#3a1d12">
    <div class="over"><img class="photo bleed" src="img/pizza.jpg" alt=""><div class="caption"><small style="opacity:.9">Order ahead · 25 min</small><h4>Ember &amp; Oak Pizza</h4></div></div>
    ${[['Margherita','$16'],['Spicy salami','$19'],['Garlic knots','$7']].map(([n,p])=>`<div class="row"><span>${n}</span><span>${p}</span></div>`).join('')}
    <div class="pill" style="background:#d4451f;color:#fff">Add to order</div>${tabs('#3a1d12')}</div>`,
  () => `<div class="app pad" style="background:#0e0f12;color:#f4f5f7">
    <small>Today</small><h4>Ironside Fitness</h4>
    <img class="photo" src="img/gym.jpg" alt="" style="height:110px">
    ${[['6:00','HIIT',.9],['12:15','Strength',.6],['5:30','Spin',1]].map(([t,n,f])=>`<div class="slot" style="background:#1b1d22"><span>${t} · ${n}</span><span style="color:${f>=1?'#ff6b4a':'#9be36b'}">${f>=1?'Full':'Book'}</span></div>`).join('')}
    ${tabs('#f4f5f7')}</div>`,
  () => `<div class="app pad" style="background:#fdf6e9;color:#3b2a14">
    <small>Next visit</small><h4>Happy Tails Grooming</h4>
    <img class="photo" src="img/dog.jpg" alt="" style="height:150px">
    <div class="tile" style="background:#f3e3c3"><div class="row"><span>Full groom · Biscuit</span><span>$75</span></div><small>Thu, 10:30 am</small></div>
    <div class="pill" style="background:#e39b2d;color:#3b2a14">Confirm booking</div>${tabs('#3b2a14')}</div>`,
  () => `<div class="app" style="background:#eaf2fb;color:#0c2a4a">
    <div class="over"><img class="photo bleed" src="img/car.jpg" alt=""><div class="caption"><h4>Spotless Auto Spa</h4></div></div>
    ${[['Express wash','$12'],['Full detail','$89'],['Unlimited monthly','$29/mo']].map(([n,p],i)=>`<div class="slot" style="background:${i===2?'#1d6fd1':'#d6e5f6'};color:${i===2?'#fff':'#0c2a4a'}"><span>${n}</span><span>${p}</span></div>`).join('')}
    ${tabs('#0c2a4a')}</div>`,
  () => `<div class="app pad" style="background:#fff;color:#3d1530">
    <small>Same-day delivery</small><h4>Petal &amp; Stem</h4>
    <img class="photo" src="img/flowers.jpg" alt="" style="height:170px">
    <div class="row"><span>Garden peony bouquet</span><span>$65</span></div>
    <div class="chips">${['Small','Medium','Large'].map((s,i)=>`<span class="chip" style="background:${i===1?'#c2185b':'#f6e3ec'};color:${i===1?'#fff':'#3d1530'}">${s}</span>`).join('')}</div>
    <div class="pill" style="background:#3d1530;color:#fff">Add to cart</div>${tabs('#3d1530')}</div>`,
  () => `<div class="app pad" style="background:#141414;color:#f0e9df">
    <small>Book a cut</small><h4>Sharp Line Barbers</h4>
    <img class="photo" src="img/haircut.jpg" alt="" style="height:120px">
    <div class="chips">${['Marcus','Dre','Luis'].map((s,i)=>`<span class="chip" style="background:${i===0?'#c9a227':'#262626'};color:${i===0?'#141414':'#f0e9df'}">${s}</span>`).join('')}</div>
    ${['10:00','11:30','2:15'].map((t,i)=>`<div class="slot" style="background:#232323"><span>${t}</span><span style="color:#c9a227">${i===1?'Booked':'Open'}</span></div>`).join('')}
    ${tabs('#f0e9df')}</div>`,
  () => `<div class="app pad" style="background:#f2f8f7;color:#0d3b3a">
    <small>Reminder</small><h4>Brightside Dental</h4>
    <img class="photo" src="img/dental.jpg" alt="" style="height:130px">
    <div class="tile" style="background:#d7ece9"><div class="row"><span>Cleaning &amp; checkup</span></div><small>Tue, Mar 4 · 9:00 am · Dr. Patel</small></div>
    <div style="display:flex;gap:8px"><div class="pill" style="flex:1;background:#0f8b84;color:#fff">Confirm</div><div class="pill" style="flex:1;background:#d7ece9;color:#0d3b3a">Reschedule</div></div>${tabs('#0d3b3a')}</div>`,
  () => `<div class="app pad" style="background:#fbf3ff;color:#2b1240">
    <small>New drop</small><h4>Stride Running Co.</h4>
    <img class="photo" src="img/sneakers.jpg" alt="" style="height:150px">
    <div class="row"><span>Tempo 3 · Sunset</span><span>$140</span></div>
    <div class="chips">${['8','8.5','9','9.5','10'].map((s,i)=>`<span class="chip" style="background:${i===3?'#7b2ff7':'#eadcf8'};color:${i===3?'#fff':'#2b1240'}">${s}</span>`).join('')}</div>
    <div class="pill" style="background:#2b1240;color:#fff">Reserve in store</div>${tabs('#2b1240')}</div>`,
  () => `<div class="app" style="background:#f7f5f1;color:#1f2a24">
    <div class="over"><img class="photo bleed" src="img/house.jpg" alt=""><div class="caption"><small style="opacity:.9">Open house Sunday</small><h4>Hearth Realty</h4></div></div>
    <div class="row" style="font-size:18px"><span>$589,000</span></div>
    <div class="chips">${['4 bd','3 ba','2,140 sq ft'].map(s=>`<span class="chip" style="background:#e4e8e2">${s}</span>`).join('')}</div>
    <div class="pill" style="background:#2f5d46;color:#fff">Schedule a tour</div>${tabs('#1f2a24')}</div>`,
  () => `<div class="app pad" style="background:#fff7ec;color:#4a2a10">
    <small>Good morning</small><h4>Rise Bakery</h4>
    <img class="photo" src="img/pastry.jpg" alt="" style="height:120px">
    <div class="tile" style="background:#4a2a10;color:#fff7ec"><div class="row"><span>Rewards</span><span>7 of 10</span></div>
      <div class="stamps" style="margin-top:8px">${Array.from({length:10},(_,i)=>`<span class="stamp" style="background:${i<7?'#f0a43a':'rgba(255,247,236,0.2)'}"></span>`).join('')}</div></div>
    <div class="pill" style="background:#f0a43a;color:#4a2a10">Order for pickup</div>${tabs('#4a2a10')}</div>`,
  () => `<div class="app pad" style="background:#eef1ea;color:#2e3a2c">
    <small>Unwind this week</small><h4 style="font-family:'Playfair Display',serif;font-weight:600">Still Water Spa</h4>
    <img class="photo" src="img/spa.jpg" alt="" style="height:140px">
    ${[['Deep tissue · 60 min','$110'],['Facial · 50 min','$95']].map(([n,p])=>`<div class="slot" style="background:#dfe5d8"><span>${n}</span><span>${p}</span></div>`).join('')}
    <div class="pill" style="background:#5b6f52;color:#fff">Book a treatment</div>${tabs('#2e3a2c')}</div>`,
  () => `<div class="app" style="background:#1d1410;color:#fff2e2">
    <div class="over"><img class="photo bleed" src="img/tacos.jpg" alt=""><div class="caption"><h4>Casa Verde Taqueria</h4></div></div>
    ${[['Carne asada (3)','$12'],['Al pastor (3)','$11'],['Horchata','$4']].map(([n,p])=>`<div class="row"><span>${n}</span><span style="color:#7cc96b">${p}</span></div>`).join('')}
    <div class="pill" style="background:#2e8b3e;color:#fff">Checkout · $27</div>${tabs('#fff2e2')}</div>`,
]

// One notification per business, in the same order as SCREENS.
const TOASTS = [
  ['Ember & Oak Pizza', 'Your pizza is out of the oven.'],
  ['Ironside Fitness', '2 spots left in 5:30 Spin.'],
  ['Happy Tails Grooming', 'Biscuit is ready for pickup.'],
  ['Spotless Auto Spa', 'Rainy week? Washes are 30% off.'],
  ['Petal & Stem', 'Your bouquet is on its way.'],
  ['Sharp Line Barbers', 'See you at 11:30 with Marcus.'],
  ['Brightside Dental', 'Reminder: cleaning on Tuesday.'],
  ['Stride Running Co.', 'Your size is back in stock.'],
  ['Hearth Realty', 'New listing in your price range.'],
  ['Rise Bakery', 'Your 8th pastry is on us.'],
  ['Still Water Spa', 'A 4 pm massage just opened up.'],
  ['Casa Verde Taqueria', 'Taco Tuesday: 2 for $5.'],
]

// Seeded random so every render of the wall is identical.
let seed = 7
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)

const wall = document.getElementById('wall')
const columns = []
for (let c = 0; c < COLUMNS; c += 1) {
  const col = document.createElement('div')
  col.className = 'col'
  const picks = Array.from({ length: PHONES_PER_COLUMN }, (_, i) => (c * 5 + i * 7) % SCREENS.length)
  // Two copies of the same run so the column can scroll one run and wrap seamlessly.
  const phones = [...picks, ...picks].map((pick) => {
    const toast = rand() < 0.4 ? TOASTS[pick] : null
    return `<div class="phone"><div class="screen">${SCREENS[pick]()}<span class="notch"></span>${
      toast ? `<div class="toast" data-phase="${rand().toFixed(3)}"><b>${toast[0]}</b>${toast[1]}</div>` : ''
    }</div></div>`
  })
  col.innerHTML = phones.join('')
  wall.appendChild(col)
  columns.push({ el: col, dir: c % 2 === 0 ? 1 : -1, speed: c % 3 === 0 ? 2 : 1, offset: rand() * STEP })
}

const toasts = [...document.querySelectorAll('.toast')]

// Pure function of time, so frames can be captured one by one and the loop closes exactly.
window.renderAt = (seconds) => {
  const p = (seconds % LOOP_SECONDS) / LOOP_SECONDS
  const turn = p * Math.PI * 2
  wall.style.transform =
    `perspective(2600px) rotateX(${48 + Math.sin(turn) * 2}deg) rotateZ(${-26 + Math.sin(turn) * 1.5}deg) translateY(${Math.cos(turn) * 30}px) scale(0.86)`
  for (const col of columns) {
    const distance = PHONES_PER_COLUMN * STEP
    const y = -(((p * col.speed * distance * col.dir) + col.offset) % distance + distance) % distance
    col.el.style.transform = `translateY(${y}px)`
  }
  for (const toast of toasts) {
    // Each toast drops in and out twice per loop at its own phase.
    const local = (p * 2 + Number(toast.dataset.phase)) % 1
    const shown = local < 0.35 ? Math.min(1, local / 0.06, (0.35 - local) / 0.06) : 0
    toast.style.opacity = shown.toFixed(3)
    toast.style.transform = `translateY(${(1 - shown) * -24}px)`
  }
}
window.renderAt(0)
</script>
</body>
</html>
